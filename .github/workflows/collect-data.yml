name: Optional observation and sky collectors
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weather-data-archive
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false && (vars.COLLECT_METAR == 'true' || vars.COLLECT_AURORAWATCH == 'true' || vars.COLLECT_ISS == 'true' || vars.COLLECT_VERIFICATION == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Collect METAR independently
        if: vars.COLLECT_METAR == 'true' || vars.COLLECT_VERIFICATION == 'true'
        continue-on-error: true
        run: node --experimental-strip-types scripts/collect.ts metar
      - name: Collect AuroraWatch independently
        if: vars.COLLECT_AURORAWATCH == 'true'
        continue-on-error: true
        run: node --experimental-strip-types scripts/collect.ts aurorawatch
      - name: Collect ISS elements independently
        if: vars.COLLECT_ISS == 'true'
        continue-on-error: true
        run: node --experimental-strip-types scripts/collect.ts iss
      - name: Collect station forecasts and held-out verification
        if: vars.COLLECT_VERIFICATION == 'true'
        continue-on-error: true
        run: node --experimental-strip-types scripts/collect.ts verification
      - name: Commit only changed source data
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Update optional weather observation and sky data'
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          name: collected-data
          path: public/data
          retention-days: 7
  publish-data:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Find latest successfully built application shell
        id: shell
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            const artifact = data.artifacts.find(a => a.name === 'site-shell' && !a.expired && a.workflow_run?.head_branch === 'main');
            if (!artifact) throw new Error('No retained site-shell artifact. Run Deploy GitHub Pages once; valid data remains committed.');
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: artifact.workflow_run.id });
            if (run.conclusion !== 'success') throw new Error('Application deployment is not complete; defer data publication.');
            core.setOutput('run-id', String(artifact.workflow_run.id));
      - uses: actions/download-artifact@v4
        with:
          name: site-shell
          path: site
          github-token: ${{ github.token }}
          run-id: ${{ steps.shell.outputs.run-id }}
      - uses: actions/download-artifact@v4
        with:
          name: collected-data
          path: site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish updated static data with the unchanged built shell
        id: deployment
        uses: actions/deploy-pages@v4
